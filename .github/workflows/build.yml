name: Build ChatGPT iPad IPA

on:
    workflow_dispatch:
    # push:
    #     branches:
    #         - main

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build:
        runs-on: macos-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Sync node version and setup cache
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0

            - name: Init Project Config
              run: |
                  pnpm install --no-frozen-lockfile
                  pnpm validate:ipad
                  pnpm pp:worker
                  pnpm validate:ipad

            - name: Generate AppIcon
              run: |
                  echo "Installing appicon tool..."
                  brew install Nonchalant/appicon/appicon
                  echo "Generating AppIcon..."
                  appicon app-icon.png --output-path ./PakePlus/Assets.xcassets/AppIcon.appiconset

            - name: Build for Release
              run: |
                  xcodebuild -project PakePlus.xcodeproj -scheme PakePlus -configuration Release -sdk iphoneos \
                    -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DerivedData" \
                    CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
                  APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/PakePlus.app"
                  test -d "$APP_PATH"
                  /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
                  /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
                  /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"

            - name: Package IPA
              run: |
                  set -euo pipefail
                  APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/PakePlus.app"
                  IPA_DIR="$PWD/build/ipa"
                  IPA_PATH="$PWD/build/${ARTIFACT_NAME}-${VERSION}.ipa"
                  rm -rf "$IPA_DIR" "$IPA_PATH"
                  mkdir -p "$IPA_DIR/Payload"
                  cp -R "$APP_PATH" "$IPA_DIR/Payload/"
                  if [[ "$ISHTML" == "true" ]]; then
                      cp -R ./scripts/www/* "$IPA_DIR/Payload/PakePlus.app/"
                  fi
                  (cd "$IPA_DIR" && zip -qry "$IPA_PATH" Payload)
                  test -f "$IPA_PATH"
                  unzip -l "$IPA_PATH" | sed -n '1,12p'

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v4
              with:
                  name: '${{ env.ARTIFACT_NAME }}-${{ env.VERSION }}'
                  path: build/${{ env.ARTIFACT_NAME }}-${{ env.VERSION }}.ipa
                  if-no-files-found: error

            - name: Publish IPA
              uses: softprops/action-gh-release@v1
              with:
                  files: build/${{ env.ARTIFACT_NAME }}-${{ env.VERSION }}.ipa
                  tag_name: '${{ env.ARTIFACT_NAME }}-v${{ env.VERSION }}'
                  name: '${{ env.ARTIFACT_NAME }} v${{ env.VERSION }}'
                  body: '${{ env.PUBBODY }}'
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
